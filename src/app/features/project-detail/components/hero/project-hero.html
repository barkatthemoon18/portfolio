<div class="project-detail-hero-grid"></div>
<div class="project-detail-hero-container container">
    <div class="project-detail-heading">
        <p class="project-detail-eyebrow">
            {{ project().visualLabel }}
        </p>
        <h1 class="project-detail-title">
            {{ project().title }}
        </h1>
        <p class="project-detail-name">
            {{ project().details.heading }}
        </p>
        <p class="project-detail-subtitle">
            {{ project().subtitle }}
        </p>
    </div>
    <div class="project-detail-technologies">
        <!-- These stateless slots display the current project's fixed technology list. -->
        @for (technology of project().technologies; track $index) {
            <span class="project-detail-technology">
                {{ technology }}
            </span>
        }
    </div>
</div>
