<header
    app-project-section-heading
    class="project-detail-section-header"
    label="03 / Strategy"
    [title]="strategy().title"
    [description]="strategy().description"
></header>
<div class="project-detail-strategy-grid">
    @for (item of strategy().items; track item.title; let index = $index) {
        <article class="project-detail-strategy-item">
            <header class="project-detail-strategy-header">
                <span class="project-detail-strategy-label">
                    {{ item.label }}
                </span>
                <span class="project-detail-strategy-number">
                    0{{ index + 1 }}
                </span>
            </header>
            <h3 class="project-detail-strategy-title">
                {{ item.title }}
            </h3>
            <p class="project-detail-strategy-description">
                {{ item.description }}
            </p>
            @if (item.technologies) {
                <div class="project-detail-stage-technologies">
                    @for (technology of item.technologies; track technology) {
                        <span>{{ technology }}</span>
                    }
                </div>
            }
        </article>
    }
</div>
