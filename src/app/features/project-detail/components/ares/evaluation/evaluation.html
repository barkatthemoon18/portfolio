<header
    app-project-section-heading
    class="project-detail-section-header"
    label="05 / Evaluation"
    [title]="evaluation().title"
    [description]="evaluation().description"
></header>
<div class="project-detail-evaluation-grid">
    @for (metric of evaluation().metrics; track metric.label) {
        <article class="project-detail-evaluation-metric">
            <span class="project-detail-evaluation-label">
                {{ metric.label }}
            </span>
            <strong class="project-detail-evaluation-value">
                {{ metric.value }}
            </strong>
            <span class="project-detail-evaluation-detail">
                {{ metric.detail }}
            </span>
        </article>
    }
</div>
@if (evaluation().notes) {
    <div class="project-detail-evaluation-notes">
        <span class="project-detail-evaluation-notes-label">
            Evaluation notes
        </span>
        <ul>
            @for (note of evaluation().notes; track note) {
                <li>
                    {{ note }}
                </li>
            }
        </ul>
    </div>
}
