<header
    app-project-section-heading
    class="project-detail-section-header"
    label="04 / Security"
    [title]="security().title"
    [description]="security().description"
></header>
<div class="project-detail-security-flow">
    <div class="project-detail-security-origin">
        <span class="project-detail-security-origin-label"> MODEL OUTPUT </span>
        <span class="project-detail-security-origin-state"> UNTRUSTED </span>
    </div>
    <div class="project-detail-security-controls">
        @for (
            control of security().controls;
            track control.title;
            let index = $index
        ) {
            <article class="project-detail-security-control">
                <header class="project-detail-security-control-header">
                    <span>
                        {{ control.label }}
                    </span>
                    <span> 0{{ index + 1 }} </span>
                </header>
                <h3>
                    {{ control.title }}
                </h3>
                <p>
                    {{ control.description }}
                </p>
            </article>
        }
    </div>
    <div class="project-detail-security-target">
        <span class="project-detail-security-target-label">
            CONTROLLED EXECUTION
        </span>
        <span class="project-detail-security-target-state"> VALIDATED </span>
    </div>
</div>
