<header
    app-project-section-heading
    class="project-detail-section-header"
    label="02 / Architecture"
    [title]="'System architecture'"
    [description]="architecture().description"
></header>
<div class="project-detail-architecture-grid">
    @for (stage of architecture().stages; track stage.title; let index = $index) {
        <article class="project-detail-stage">
            <div class="project-detail-stage-header">
                <span class="project-detail-stage-number">
                    0{{ index + 1 }}
                </span>

                <span
                    class="project-detail-stage-node"
                    aria-hidden="true"
                ></span>
            </div>
            <h3 class="project-detail-stage-title">
                {{ stage.title }}
            </h3>
            <p class="project-detail-stage-description">
                {{ stage.description }}
            </p>
            @if (stage.technologies) {
                <div class="project-detail-stage-technologies">
                    @for (technology of stage.technologies; track technology) {
                        <span>
                            {{ technology }}
                        </span>
                    }
                </div>
            }
        </article>
    }
</div>
