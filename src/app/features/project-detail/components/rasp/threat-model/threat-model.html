<header
    app-project-section-heading
    class="project-detail-section-header"
    label="02 / Threat Model"
    [title]="threatModel().title"
    [description]="threatModel().description"
></header>
<div class="project-detail-threat-grid">
    @for (threat of threatModel().threats; track threat.title; let index = $index) {
        <article class="project-detail-threat">
            <header class="project-detail-threat-header">
                <span class="project-detail-threat-category">
                    {{ threat.category }}
                </span>
                <span class="project-detail-threat-number">
                    0{{ index + 1 }}
                </span>
            </header>
            <h3 class="project-detail-threat-title">
                {{ threat.title }}
            </h3>
            <p class="project-detail-threat-description">
                {{ threat.description }}
            </p>
            <div class="project-detail-threat-indicators">
                @for (indicator of threat.indicators; track indicator) {
                    <span>
                        {{ indicator }}
                    </span>
                }
            </div>
        </article>
    }
</div>
