<section class="stats-bar">
    <div class="stats-container container">
        @for (stat of stats; track stat.label) {
            <article class="stat-item">
                <span class="stat-value">
                    {{ stat.value }}
                </span>
                <span class="stat-label">
                    {{ stat.label }}
                </span>
            </article>
        }
    </div>
</section>
